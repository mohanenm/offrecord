id: ho-sales-partner-pitch-04
domain: sales
speakers:
  A: partnerships lead at a marketing agency
  B: brand manager at a consumer retailer
turns:
  - A: "Hiya! Oh -- you're on mute."
  - B: "Am I? There. Sorry. Hi!"
  - A: "No worries. How's your week going? Did the snow hit you guys?"
  - B: "Oh, it was mad, we got like a foot. The kids were thrilled, I was not."
  - A: "Ha. Yeah. Okay so, um, I wanted to walk you through the co-marketing idea with {brand_common#1} --"
  - B: "Mm-hmm."
  - A: "-- because I think there's a really natural fit with {brand#1}. Their app users skew the same age as yours."
  - B: "Totally. Half our team uses the {brand_common#1} app to split lunch bills."
  - A: "Right? So the pitch is a bundle: buy anything from the {brand#1.alias} spring line and you get a {brand_common#1} gift card with credit loaded."
  - B: "How much credit?"
  - A: "We were thinking {amount#1.spoken} per customer, capped at {quantity#1} redemptions."
  - B: "Okay. And who funds that?"
  - A: "Split fifty-fifty. Sorry -- well, sixty-forty, they'd carry the bigger share."
  - B: "Interesting. You know, my grandmother had a little china {brand_common#1.word} on her mantelpiece, so that's honestly what the name makes me picture."
  - A: "Ha! That's adorable. Hopefully not their target market."
  - B: "No. Ha. Okay, serious question: do we know how they did with {brand#2}? I heard that tie-up flopped."
  - A: "I heard the same. I think {brand#2.lower} pushed it too hard online. Ours would be in-store too, they're in {quantity#2.spoken} stores now."
  - B: "Wow, that's grown."
  - A: "Also -- keep this under your hat -- [[TOPIC: they're in talks to be acquired, so anything we sign could get reopened by the new owner]]."
  - B: "Oh. Hm. That matters."
  - A: "Yeah, I'd want an exit clause."
  - B: "And it's not {brand#2.asr} doing the buying, is it? Please tell me it's not them."
  - A: "Ha, no, I don't think so, someone private. Anyway."
  - B: "Okay. Who should I loop in on their side?"
  - A: "{person#1.full}, she runs partnerships. Her email is {email#1.spoken}."
  - B: "Got it. And you'll send the deck?"
  - A: "Yeah, and it's up at {url#1.spoken} if you want to share it around internally."
  - B: "Lovely."
  - A: "We'd also buy the ad slots on {brand_common#2}, their rates dropped like {percent#1} this year."
  - B: "Wait, didn't {brand_common#2} lose a load of subscribers?"
  - A: "Some. Not enough to matter for us."
  - B: "Okay. Honestly the only {brand_common#2.word} I'm thinking about right now is the cardboard one my son made for his school project, so. Let's wrap."
  - A: "Ha! Fair. Thanks so much, talk Friday?"
  - B: "Friday. Bye!"

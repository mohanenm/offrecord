id: se-internal-reorg-01
domain: internal
speakers:
  A: chief executive, US, long-winded
  B: chief people officer, British
  C: CFO, US, terse
  D: head of engineering, Dutch, direct
  E: general counsel, US, cautious
  F: chief of staff, British, takes notes
turns:
  - F: "Okay, recording's off. Sorry, I mean, it's on for my notes, but it doesn't leave this room. Everyone okay with that?"
  - E: "Notes yes, recording no. Please."
  - F: "Right, fine, stopping it. Done."
  - A: "Great. Thanks everybody. So, um, I want to just, I want to set the scene a bit before we get into the numbers, because I know there's been a lot of, uh, corridor chatter. I've been in [[LOCATION: Singapore]] and then [[LOCATION: Sydney]] for most of the last two weeks, talking to the teams out there, and honestly the mood is fine, people are working hard, but they can tell something's coming. And, look, something is coming. [[TOPIC: We're going to consolidate the three regional hubs into two, which means the {location#1} office closes and those roles either move or go.]] I want us to be really thoughtful about how we land that."
  - B: "Can I just jump in on the timing?"
  - A: "Please."
  - B: "So we can't announce anything before [[DATE: the fourteenth]], because we have to start the consultation process in the UK properly, and that's a minimum period, we can't shortcut it."
  - C: "How many roles?"
  - B: "In total, across everything, it's {quantity#1.spoken}. That's about [[PERCENT: eleven percent]] of headcount."
  - C: "I had it at [[PERCENT: twelve]]."
  - B: "[[PERCENT: Twelve]] before the voluntary leavers. [[PERCENT: Eleven]] after."
  - C: "Okay."
  - D: "And how many of those are mine? Because I am going to be honest, if you take more than a handful from platform we will not ship {codename#1} this year. It is that simple."
  - A: "{codename#1.alias} is protected. I said that in the board pack."
  - D: "Protected how? With what people?"
  - A: "With the people you have now."
  - D: "[[TOPIC: Two of my leads are already interviewing elsewhere because of the rumours, so the people I have now is not a fixed number.]]"
  - B: "We know. We're putting retention bonuses in for, um, a small list. {person#1} is on it. So is {person#2.first}. And {person#3.asr}, I think."
  - D: "Good. Thank you. That helps."
  - C: "Can we talk about why we're doing this, for the record? Because the board will ask."
  - A: "Sure, go ahead."
  - C: "Revenue came in at {amount#1}. Plan was higher. Margin's down to {percent#1}. [[TOPIC: At the current burn we run out of cash in about fourteen months, and the bank covenant gets tested at the end of the year.]]"
  - E: "And I'd like that last bit not written down in quite those words, please."
  - F: "Noted. I'll put 'liquidity discussed'."
  - E: "Thank you."
  - A: "And it's also, it's not just cost, right, it's focus. We've been trying to be everything to everyone. [[TOPIC: We're winding down the hardware line, which nobody outside this room knows yet, and that frees up the Ohio warehouse too.]]"
  - E: "Can I raise something adjacent?"
  - A: "Go."
  - E: "[[TOPIC: The {client#1} dispute is getting worse and their lawyers sent a letter on Friday threatening to sue over the delayed rollout.]] I'd really rather we didn't announce cuts the same week."
  - A: "Ugh. Okay. How much are they claiming?"
  - E: "They haven't put a number on it. Outside counsel at [[ORG: Pemberton Raike LLP]] think it's a negotiating posture."
  - C: "Is it material?"
  - E: "Could be. [[PERCENT: Two to three percent]] of revenue if it went badly. I don't think it will."
  - B: "Can I go back to the people side? Sorry. The {location#2} team. [[TOPIC: There's a manager there who's been off on long-term sick leave for her mental health, and we have to be extremely careful not to select her role for redundancy.]]"
  - E: "Very careful. That's a claim waiting to happen."
  - B: "Exactly."
  - A: "Of course. Yeah. Who else knows about all this?"
  - F: "Just this group and the board. And the comms agency, under NDA."
  - A: "Which agency?"
  - F: "[[ORG: Haverleigh & Stone]]. Same as last time."
  - A: "Fine. So, okay, what's the comms plan?"
  - B: "All-hands on [[DATE: the fourteenth]], managers briefed the night before, letters same day. People in [[LOCATION: Texas]] and [[LOCATION: Ontario]] get theirs first because of the time zones, then [[LOCATION: Manchester]] and the [[LOCATION: Brackwater Lane]] site the following morning."
  - D: "Please do not do it on a Friday. [[NEG: Fridays]] in general are fine, but not for this."
  - B: "It's a [[DATE: Tuesday]]."
  - D: "Good."
  - C: "And severance is budgeted at {amount#2}."
  - A: "Okay. Anything else?"
  - E: "Just, everybody, [[TOPIC: nothing about the restructure in Slack or email, phone or in person only until it's announced.]]"
  - A: "Got it. Okay. Thanks all, this is hard stuff. Let's take ten."

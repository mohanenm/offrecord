id: se-internal-standup-03
domain: internal
speakers:
  A: engineering manager, US, runs the standup
  B: backend engineer, British
  C: frontend engineer, US
  D: SRE, Nigerian-British
  E: QA lead, US
  F: product manager, Scottish
turns:
  - A: "Morning. Let's go fast. {person#1.first}?"
  - B: "Yeah. Finished the migration script. Testing today."
  - A: "Blockers?"
  - B: "Nope."
  - A: "Cool. Next."
  - C: "Still on the checkout redesign for {codename#1}. About, uh, [[PERCENT: seventy percent]] done."
  - A: "[[PERCENT: Seventy]]?"
  - C: "Ish. [[PERCENT: Sixty-five]]. [[PERCENT: Sixty-five percent]]. Be honest."
  - A: "Ha. Okay."
  - D: "Me. So. Overnight we had a spike. Error rate went to {percent#1} for about twenty minutes."
  - A: "Cause?"
  - D: "Traffic from {ip#1}. Hammering the login endpoint."
  - F: "Like, an attack?"
  - D: "[[TOPIC: Looks like credential stuffing, and a handful of accounts may have actually been logged into.]]"
  - A: "How many?"
  - D: "Not sure yet. Under {quantity#1}."
  - A: "Okay. Security's looped in?"
  - D: "Yeah. And I blocked the range. Also {ip#2}, same pattern."
  - E: "Do we tell customers?"
  - A: "[[TOPIC: Not yet, and nobody mention it in the public channel until legal decides whether it's reportable.]]"
  - E: "Got it."
  - A: "Anything else, {person#2.first}?"
  - D: "Just, the [[LOCATION: Oregon]] region's flapping again. I've opened a ticket. {account#1}."
  - A: "Thanks. QA?"
  - E: "Regression suite's green except two flaky ones. Coverage's up to [[PERCENT: eighty-one]]."
  - A: "Nice."
  - E: "Also the {product#1} release notes link is broken. It points at {url#1}, which is the old staging."
  - B: "Oh, that's mine. Sorry. I'll fix it."
  - E: "Ta."
  - A: "Product?"
  - F: "Aye. So, couple of things. One, launch date for {codename#1.alias} is [[DATE: the third of March]]. [[TOPIC: Please, please do not tell anyone at {client#1} even though they keep asking, we haven't told the board the scope got cut.]]"
  - C: "The scope got cut?"
  - F: "A wee bit. The offline mode's out."
  - C: "Oh. Okay."
  - F: "Two. Beta signups. We've got about [[QUANTITY: four hundred]] from [[LOCATION: Scotland]] and [[LOCATION: the north of England]], and a big chunk from [[LOCATION: the Bay Area]], weirdly."
  - B: "Not weird. That's where the nerds are."
  - F: "Ha. Fair. And three, conversion on the new onboarding is up, like, [[PERCENT: doubled]]. [[PERCENT: Doubled]] from where it was."
  - A: "[[PERCENT: Doubled]]?"
  - F: "From [[PERCENT: three]] to [[PERCENT: six percent]]. Small base. Still."
  - A: "Still. Nice. Okay. Anything else?"
  - C: "Uh, yeah, quick one. Is the team offsite still happening? In {location#1}?"
  - A: "Um."
  - F: "Hmm."
  - A: "[[TOPIC: It's, it's on hold, there's a spending review going on and travel's frozen until it's done.]]"
  - C: "Oh."
  - A: "[[TOPIC: Not because anything bad is happening, so don't read into it.]]"
  - C: "Sure."
  - B: "That's literally what they said last time. [[NEG: Did anyone watch that show where the whole company gets fired in the first episode? Brilliant telly.]]"
  - A: "Okay! Moving on. {person#3}, you're back on [[DATE: Monday]], right?"
  - E: "Yeah, she's back [[DATE: Monday]]. [[TOPIC: She's doing a phased return after the surgery, so mornings only for the first month.]]"
  - A: "Got it. Oh, and the {codename#1.asr} demo is still on for [[DATE: Thursday]]. Okay, that's it. Thanks all."
  - D: "Cheers."

id: se-other-recruiting-04
domain: other
speakers:
  A: agency recruiter, British, breezy and casual
  B: candidate, a senior data engineer, Portuguese-British, thoughtful
turns:
  - A: "Hiya! Can you hear me alright? I'm on the train, so if I cut out, that's why."
  - B: "Yeah, I can hear you. Bit echoey."
  - A: "Sorry, I'm in the vestibule thing. Okay. So, thanks for jumping on. I wanted to chat about the role at {client#1}."
  - B: "Sure. I had a look at the spec."
  - A: "Amazing. So, quick background, they're a fintech, about {quantity#1} people, head office in [[LOCATION: Canary Wharf]] but really flexible, and they've got a hub in [[LOCATION: Lisbon]] too, which I thought might interest you?"
  - B: "It does, actually. My family's from just outside [[LOCATION: Porto]], a little village called [[LOCATION: Vila Corgueira]]."
  - A: "Oh, lovely! Okay, so, first question, and I ask everyone this, why are you looking?"
  - B: "Um. Okay. Honestly? [[TOPIC: My current place has had two rounds of redundancies this year and I'd rather jump before I'm pushed.]]"
  - A: "Totally fair. And that's [[ORG: Strathgowan Analytics]], right?"
  - B: "Yes. Please don't tell anyone there I'm looking."
  - A: "God, no. Never. Everything's confidential."
  - B: "Thanks. [[TOPIC: And also, um, my manager and I don't really get on, there was a grievance last year that I raised, and it's been awkward ever since.]]"
  - A: "Ah. Okay. Thanks for telling me. I won't put that in my notes to the client."
  - B: "I'd appreciate that."
  - A: "So what are you on at the moment? Base?"
  - B: "{amount#1}, plus a bonus that's supposed to be [[PERCENT: fifteen percent]] but last year it paid out at, like, [[PERCENT: a third]] of that."
  - A: "Oof. So [[PERCENT: five-ish percent]] in real terms."
  - B: "Yeah."
  - A: "Okay, so this role is budgeted at {amount#2} base, and their bonus is [[PERCENT: ten to twenty percent]], depending on company performance. And it actually pays out, from what I hear."
  - B: "Okay. That's decent."
  - A: "It's a nice bump. Like, what, [[PERCENT: twenty-two percent]] on base? Roughly?"
  - B: "Something like that. And is there equity?"
  - A: "Yes, options. I don't have the exact number. [[TOPIC: Between you and me, I think they're gearing up to raise again, or possibly to be bought, so the options could be worth something.]]"
  - B: "Who'd buy them?"
  - A: "I genuinely don't know. I just hear things on the grapevine."
  - B: "Ha. Okay."
  - A: "Next one, location. Would you consider relocating to [[LOCATION: Lisbon]]? Like, actually moving?"
  - B: "Maybe. [[TOPIC: My mum's not been well, she's going through chemo at the moment, so being closer to her would honestly be a relief.]]"
  - A: "Oh, I'm so sorry. That must be really hard."
  - B: "It's okay. It is what it is."
  - A: "Okay, well, they do relocation packages, so let's flag that. And, um, notice period?"
  - B: "Three months. Technically."
  - A: "And untechnically?"
  - B: "Ha. They'd probably let me go sooner. They're not exactly flush."
  - A: "Ha! Okay. So the process is a call with the hiring manager, {person#1}, then a technical take-home, then a final round in person."
  - B: "In [[LOCATION: London]]?"
  - A: "[[LOCATION: London]] or [[LOCATION: Lisbon]], your choice. They'll pay travel."
  - B: "Okay. Great."
  - A: "And can I check your best email for the invite?"
  - split:
      speaker: B
      slot: "email#1.spoken"
      before: "Yeah, use my personal one, it's"
      interrupt: { speaker: A, text: "hang on, tunnel, say again? okay, go" }
      after: "not the work one, obviously."
  - A: "Obviously. Ha. And phone, still {phone#1}?"
  - B: "Yes."
  - A: "Brilliant. And last thing, have you got your CV in a link or something? A portfolio?"
  - B: "Yeah, it's on {url#1}."
  - A: "Perfect. I'll pass it on. They've filled, like, [[PERCENT: ninety percent]] of their roles through us this year, so I've got a good line in."
  - B: "Good to know."
  - A: "Okay! I'll ping you by [[DATE: Thursday]] with a time. Thanks so much, speak soon!"
  - B: "Thanks, bye."

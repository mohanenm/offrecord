id: se-other-fraud-03
domain: other
speakers:
  A: fraud investigator at a retail bank, US, calm
  B: small business owner, US, upset
  C: fraud team supervisor, US, joins briefly
turns:
  - A: "Hi, this is the fraud department at [[ORG: Coldharbour Federal Bank]], am I speaking with {person#1}?"
  - B: "Yes. Yes, that's me. Thank God, I've been on hold for forty minutes."
  - A: "I'm sorry about that. We're seeing a lot of volume today. I understand you reported some transactions you didn't recognise?"
  - B: "Some? There's like nine of them. On the business account."
  - A: "Okay. Let's go through it. Before I can discuss the account, I need to verify a couple things. Can you give me the account number?"
  - B: "It's {account#1}."
  - A: "Thank you. And the debit card on the account?"
  - split:
      speaker: B
      slot: "card#1"
      before: "The card is"
      interrupt: { speaker: A, text: "okay, keep going" }
      after: "expires next year sometime."
  - A: "Perfect. Thank you. Okay, so I see a login [[DATE: yesterday]] evening from a device we haven't seen before. The IP address is {ip#1}, and it geolocates to [[LOCATION: Lagos]]."
  - B: "I've never been to [[LOCATION: Nigeria]]. I've barely been out of [[LOCATION: Ohio]]. I live in [[LOCATION: Severance Ridge]], for God's sake."
  - A: "Okay. And then there are wire transfers, the first one for {amount#1}, then a bunch of smaller ones to an account at another bank."
  - B: "That's... that's payroll. That's my payroll money."
  - A: "I know. Okay. So, the good news is, two of the wires are still pending, so I can stop those right now."
  - B: "Please. Please do."
  - A: "Done. Those are stopped."
  - B: "And the others?"
  - A: "We'll try a recall. Recall success rates are, honestly, it depends, but for domestic wires caught within a day it's maybe [[PERCENT: sixty to seventy percent]]."
  - B: "And if it's not domestic?"
  - A: "Much lower. [[PERCENT: Single digits]], sometimes."
  - B: "Oh God. [[TOPIC: If I can't make payroll on Friday I'm going to have to let people go, and these are people I've known for twenty years.]]"
  - A: "I hear you. Let me bring in my supervisor, one moment."
  - C: "Hi, this is {person#2.first}, I supervise the team. I've been listening in. So, a couple of things. Did you get any phone calls or emails recently asking you to confirm details?"
  - B: "Um. Actually, yes. Someone called last week from what looked like your number. They said it was a security check and they sent me a code."
  - C: "And you read them the code?"
  - B: "Yes. I thought it was you."
  - C: "Okay. That's what we suspected. [[TOPIC: We've had a cluster of these in the {location#1} area this month, and we think someone's got hold of a customer list from somewhere.]]"
  - B: "From you?"
  - C: "[[TOPIC: I can't say that, and to be clear there is no evidence of a breach on our side, but it's being investigated.]]"
  - B: "That sounds like a yes."
  - C: "It's genuinely not. Okay. {person#3.first} will take you through the next steps."
  - A: "Thanks. So, first, I'm going to cancel that card and issue a new one. It'll go to the business address, is that still [[LOCATION: 3150 Kinross Avenue, Suite 4]]?"
  - B: "Yes."
  - A: "Second, I'm opening a fraud claim, the reference is {order#1}. You'll need to fill out an affidavit, I'll email it."
  - B: "Okay. Email's {email#1}."
  - A: "Got it. Third, I'd strongly recommend changing your online banking password, and the phone number we have on file is {phone#1.corrected}, is that right?"
  - B: "No, the second one, that's right."
  - A: "Good. And lastly, have you got any other accounts? Personal?"
  - B: "[[TOPIC: My personal one's basically empty, my wife and I are separating and the lawyers froze the joint account.]]"
  - A: "Okay. I'm sorry to hear that. I'll just flag the business one then."
  - B: "Thanks. Sorry. It's been a year."
  - A: "Understandable. And for what it's worth, you've got overdraft protection on the business account at a rate of {percent#1}, which might help bridge payroll if the recall's slow."
  - B: "That's a terrible rate."
  - A: "It's not great. But it's better than missing payroll."
  - B: "Yeah. Okay. When will I know about the recall?"
  - A: "Usually within ten business days. I'll call you either way."
  - B: "Okay. Thank you. Really. You've been great."
  - A: "Take care. And remember, we'll never ask you for a code over the phone, or over [[NEG: Zoom]], or anywhere."
  - B: "Yeah. Lesson learned."

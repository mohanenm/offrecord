id: se-sales-discovery-04
domain: sales
speakers:
  A: sales development rep at the vendor, US, eager
  B: owner of a regional dental group (prospect), Canadian, rambling
  C: practice manager at the prospect, joins late
turns:
  - A: "Hi there, is this {person#1}?"
  - B: "Speaking, yeah. Sorry, hang on, let me close the door. Okay. Go ahead."
  - A: "Great, thanks so much for taking the call. I'm with [[ORG: Mossbridge Practice Systems]]..."
  - B: "Oh, right, right, you're the scheduling software people."
  - A: "That's us. So I'd love to just understand a bit about how things work today, if that's okay."
  - B: "Sure, sure. Well, so, okay, the short version is there isn't a short version. We started as one clinic, my dad's clinic actually, back home in [[LOCATION: Saskatchewan]], and then when I moved down here I opened the first one in {location#1}, and then a second, and then we bought a practice off a fella who was retiring in [[LOCATION: Grand Forks]], and now it's, uh, it's {quantity#1} locations and every single one of them books appointments differently. One of them still has a paper diary. I'm not joking. A paper diary with a, with an elastic band around it."
  - A: "Wow. Okay."
  - B: "Yeah."
  - A: "And roughly how many patients are we talking, across all of them?"
  - B: "Ooh. Active? Maybe {quantity#2}? But the no-show rate, that's the thing that kills me. We're at, I want to say {percent#1}, some weeks worse, and every empty chair is, I mean, you know, that's real money, that's a hygienist standing around at, what, [[AMOUNT: sixty bucks]] an hour."
  - A: "Right, right."
  - B: "And the other thing, and I probably shouldn't say this on a sales call, but whatever, [[TOPIC: we had a bit of a scare last year where one of the front desk computers got one of those ransomware things and we had to tell patients, and our insurance went through the roof after.]]"
  - A: "Oh no. That's awful."
  - B: "Yeah it was not a fun month. So security, that's a big one for me. Big one."
  - A: "Totally. So, um, just quickly, what are you using now? For the ones that aren't, uh, paper?"
  - B: "Some of them are on {product#1}, and the [[LOCATION: Grand Forks]] one came with some old thing that I think is held together with tape. My nephew set it up. Don't tell him I said that."
  - A: "Ha! Your secret's safe."
  - B: "And honestly the reason I picked up today is, um. [[TOPIC: My business partner and I are, let's say, not seeing eye to eye on things, and I think there's a real chance I end up buying him out or he buys me out by the end of the year.]] So whatever we do, it has to be something I can run on my own."
  - A: "Understood. That's really helpful context."
  - B: "Oh, and growth. If things go the way I want, I want to open in [[LOCATION: Fargo]] and maybe [[LOCATION: Sioux Falls]]. Two more."
  - A: "Okay, so, our customers usually see no-shows come down by, like, [[PERCENT: a third]] in the first six months, mostly from the text reminders."
  - B: "[[PERCENT: A third]]. Huh. That'd be... yeah. Even [[PERCENT: half]] of that pays for itself, honestly."
  - A: "And pricing's per chair, so at your size you'd be looking at roughly {amount#1} a month."
  - B: "Per location?"
  - A: "Total. Across all of them."
  - B: "Oh. Okay. That's, uh, that's less scary than I thought."
  - C: "Sorry, sorry, I'm here. The roads in from {location#2} are a skating rink."
  - B: "This is {person#2.first}, she runs the front desks. Basically she runs everything, I just sign things."
  - C: "Ha. Hi."
  - A: "Hi! Thanks for joining."
  - C: "So did he tell you about the paper diary?"
  - A: "He did."
  - C: "Good. Because I've been asking for something like this for two years."
  - B: "Okay, okay."
  - C: "And can I ask, the reminders, do they go out from our number or yours? Because [[PERCENT: half]] our patients won't pick up an unknown number. Especially the older ones."
  - A: "Yours. We port it or forward it, whatever's easier."
  - C: "Our main line is {phone#1}, so it'd have to be that one."
  - A: "Perfect. Totally doable."
  - B: "What do you need from us to, like, send something over?"
  - A: "Just an email and a rough list of the locations."
  - C: "Send it to me, {email#1}. He doesn't check his."
  - B: "I check it."
  - C: "You check it in [[DATE: January]] and [[DATE: July]]."
  - B: "Ha. Okay, that's fair. That's fair."
  - A: "Ha. Great. And the addresses?"
  - C: "Main office is [[LOCATION: 2207 Corrigan Road, Wexcombe Parva]], the rest I'll put in the email."
  - A: "Perfect. And one last thing, any reason we couldn't start in, say, [[DATE: February]]?"
  - B: "[[TOPIC: Depends whether I still own half the business in February, honestly.]]"
  - C: "Oh my God."
  - B: "Kidding. Mostly. Send it over."
  - A: "Will do. Thanks both, have a great day."

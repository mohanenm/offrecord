id: se-support-billing-01
domain: support
speakers:
  A: billing support agent, US, scripted then relaxed
  B: customer, British, irritated
turns:
  - A: "Thank you for calling {brand_common#1} billing support, my name's on your screen, how can I help today?"
  - B: "Hiya. Yes. I've been charged twice. Well, three times actually, if you count the one from [[DATE: last Tuesday]]."
  - A: "Oh, I'm so sorry about that. Let's get it sorted. Can I start with the account number?"
  - B: "It's {account#1.spoken}."
  - A: "Thank you. So that's {account#1}?"
  - B: "That's it."
  - A: "Great. And for security, can you confirm the postcode on the account?"
  - B: "I moved, that's partly the problem. It's still got my old flat in [[LOCATION: Croydon]] on it, I think. I'm in {location#1} now."
  - A: "No problem, I can see the old address. And the new one?"
  - B: "[[LOCATION: Flat 3, 18 Parrish Mews, Thornwell St Giles]], postcode's on the form."
  - A: "Got it."
  - B: "Sorry. It's just, this is the third time I've rung, and [[TOPIC: I've only just gone back to work after being signed off for months with my nerves, so money's tight.]]"
  - A: "I completely understand. Okay, so I'm looking at the charges now. I see {amount#1} on [[DATE: the fourth]], and again on [[DATE: the fifth]], and then..."
  - B: "And then another one."
  - A: "And then another one, yep, for {amount#2}."
  - B: "Which I didn't authorise."
  - A: "Okay. And which card was that on?"
  - split:
      speaker: B
      slot: "card#1.spoken"
      before: "The card's the one ending, um, hang on, let me get my purse, it's"
      interrupt: { speaker: A, text: "take your time" }
      after: "yeah, that's the one."
  - A: "Perfect, that matches. So, um, the good news is two of those are definitely duplicates, so I can reverse those right now."
  - B: "And the third?"
  - A: "The third one looks like it's from the {brand#1} add-on. Did you maybe sign up for a trial?"
  - B: "Absolutely not. I don't even know what that is."
  - A: "Okay. Hmm. So, between us, we've had a few of these this week. [[TOPIC: There was a problem with our payment system that charged some people for add-ons they never picked, and the team's still working out how many.]]"
  - B: "Oh, brilliant. So it's not just me."
  - A: "It's not just you. I'll flag it."
  - B: "Will I get compensation? Because I went overdrawn. [[ORG: Hollins Cross Building Society]] charged me a fee, the branch on [[LOCATION: Ladbroke Parade]] was useless."
  - A: "I can add a goodwill credit. I'm allowed to do up to, um, [[PERCENT: twenty percent]] of a month's bill, so that'd be..."
  - B: "[[PERCENT: Twenty percent]] of what I'm paying is about the price of a sandwich."
  - A: "Ha, I know. Let me see if I can do more. Hold on."
  - B: "Mm."
  - A: "Okay, my supervisor says I can do [[PERCENT: fifty percent]] off next month, plus refunding the bank fee if you send us the statement."
  - B: "Fine. Yes. Thank you."
  - A: "And where should I send the confirmation?"
  - B: "{email#1}"
  - A: "Let me read that back. {email#1.spoken}?"
  - B: "Yep."
  - A: "Lovely. And just so you know, prices are going up, um, about [[PERCENT: four pct]] in the new year, that's on the website, it's not a secret."
  - B: "Course they are."
  - A: "I know, I know. [[TOPIC: Honestly I'd keep an eye on your statements for a couple of months, I think there are a lot more accounts affected than we're being told.]]"
  - B: "That's not reassuring."
  - A: "Sorry. I'm being honest though."
  - B: "No, I appreciate it. Is there a reference for this call?"
  - A: "Yep, it's {order#1}."
  - B: "And if I need to ring again?"
  - A: "The direct line for escalations is {phone#1}."
  - B: "Okay. Thanks. Sorry I was short with you earlier."
  - A: "Oh, don't worry at all. [[PERCENT: Nine out of ten]] calls today have been about this. Have a good evening."
  - B: "You too. Bye."

id: se-other-nonprofit-08
domain: other
speakers:
  A: director of development at a food-bank charity, US, warm, rambles
  B: major-gifts officer at the charity, British, organised
  C: board treasurer, US, blunt
  D: volunteer coordinator, US, quiet
turns:
  - A: "Okay, hi everyone, sorry, I was on with a donor and it ran long, as they do. Thanks for waiting. So, um, I wanted us to do a quick, a real quick check on where we are with the winter appeal, because, honestly, and I'm just going to say this up front so nobody's surprised, it's not where I hoped it would be, and I've been losing a bit of sleep over it, and I think if we're smart about the next six weeks we can turn it around, but I need everyone's help."
  - B: "Sure. Shall I start with the numbers?"
  - A: "Please."
  - B: "So we're at {amount#1} against a goal of {amount#2}. That's, um, [[PERCENT: fifty-eight percent]] of target with about a month to go."
  - C: "Last year at this point we were at [[PERCENT: seventy-something]]."
  - B: "[[PERCENT: Seventy-four]], yes."
  - C: "So we're down [[PERCENT: sixteen points]]."
  - B: "Roughly. Yes."
  - A: "And the big piece is, um, well. [[TOPIC: The {person#1.last} family foundation told us last week they're pulling their pledge, and that was going to be the matching gift.]]"
  - D: "Oh no. Why?"
  - A: "[[TOPIC: Officially it's a change in priorities, but I've heard it's because of the stuff that came out about our old executive director.]]"
  - C: "The expenses stuff."
  - A: "The expenses stuff. Yes."
  - C: "[[TOPIC: Which, for the record, the auditors are still looking at, and we have not yet told the state attorney general's office, which we may be required to do.]]"
  - B: "Should this be in the minutes?"
  - C: "No."
  - B: "Okay."
  - A: "So, anyway. We need to replace that match. {person#2.first}, you had some ideas?"
  - B: "Yes. So I've got three prospects. One is {client#1}, they've given before, small amounts, but their new CEO grew up in [[LOCATION: Dayton]] and apparently used our pantry as a kid."
  - D: "Oh, that's a nice story."
  - B: "It is. Second is a couple in {location#1} who've just sold a business. And third is {client#2.asr}, who do an employee giving thing."
  - C: "Do they match?"
  - B: "They match employee gifts at [[PERCENT: a hundred percent]], up to a cap."
  - A: "Okay, great, that's great. And {person#3.first}, volunteer side?"
  - D: "Um, yeah. Numbers are, um, down a bit. We've got about {quantity#1} regulars. Down from last year. [[TOPIC: A few people stopped coming after the incident at the...]]"
  - A: "Sorry, after what?"
  - D: "After the incident at the east side pantry. [[TOPIC: The one where the volunteer got assaulted in the parking lot.]]"
  - A: "Right. Yes. Okay."
  - D: "And the new site in [[LOCATION: the Tri-County area]] still doesn't have a lead."
  - C: "Can I just raise the, um, the overhead question? Because donors are going to ask."
  - A: "Go ahead."
  - C: "Our overhead's at {percent#1}. The watchdog sites like to see it under [[NEG: twenty-five percent]]. We're fine, technically. But barely."
  - B: "And our program spend ratio's around [[PERCENT: three quarters]], which looks good on the website."
  - C: "Mm."
  - A: "Okay. And, look, [[TOPIC: there's no plan to close any of the pantries, I want to be really clear, I know there's been talk, but it's just talk.]]"
  - D: "Okay. Good. People are worried."
  - A: "I know. And [[NEG: honestly that documentary about food banks closing in the eighties was rough to watch, but that's not us.]]"
  - C: "Ha. Sure."
  - B: "Next steps then. I'll set up meetings with all three prospects. Probably the first by {date#1}."
  - A: "Great. And the gala's still on for [[DATE: the twelfth of December]], at the [[LOCATION: Grange Hall on Maple and Fifth]]?"
  - B: "Yes. We've sold about [[PERCENT: two thirds]] of the tables."
  - C: "At what price?"
  - B: "{amount#3.spoken} a table. And we'll push hard on [[NEG: Giving Tuesday]] like everyone else."
  - C: "Okay."
  - A: "Okay. Let's do it. Thanks, everyone. I really mean that."
  - D: "Thanks."
  - C: "Bye."

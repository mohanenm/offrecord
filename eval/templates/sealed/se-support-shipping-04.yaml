id: se-support-shipping-04
domain: support
speakers:
  A: chat-to-voice support agent for an online homeware store, British, warm
  B: customer, US expat living in the UK, chatty
  C: warehouse team lead, British, brought in mid-call
turns:
  - A: "Hello, you're through to {brand#1} customer care, how can I help?"
  - B: "Hi! Okay so this is going to sound so stupid but my sofa is in [[LOCATION: Belgium]]."
  - A: "Oh dear. Your... sofa?"
  - B: "My sofa. I ordered it, it was supposed to come to [[LOCATION: Bristol]], and the tracking says it's in [[LOCATION: Antwerp]]. Has been for, like, a week."
  - A: "Okay, let's have a look. Have you got the order number?"
  - B: "Yep, it's {order#1}."
  - A: "Lovely, so that's {order#1.spoken}?"
  - B: "Yes. Exactly."
  - A: "Okay, I've got it. A three-seater, in, ooh, the sage velvet. Very nice."
  - B: "Thank you! I was very excited. Until, you know."
  - A: "Ha, yes. Okay so it looks like it was routed through our {location#1} hub and then, um, I'm not sure what happened after that. Can I pop you on hold and get someone from the warehouse?"
  - B: "Sure, sure."
  - A: "Thanks. Won't be long."
  - C: "Hiya, it's the warehouse. Is this the sofa?"
  - A: "It's the sofa."
  - C: "Right. So. Bit embarrassing. [[TOPIC: We changed couriers about a month ago because the old one went bust, and the new lot have been sending a fair chunk of stuff to the wrong country.]]"
  - B: "Oh no!"
  - C: "Yeah. It's, um, it's not just you. It's maybe [[PERCENT: one in twenty]] parcels at the moment."
  - A: "Which, I should say, isn't something we're telling people officially."
  - C: "No, please don't post that anywhere."
  - B: "I won't! I won't. I mean, I'm tempted. But I won't."
  - C: "Ha. Appreciated. So it'll be back across by [[DATE: the eighteenth]], and then delivered within three days of that."
  - B: "Okay. That's fine. Can I double check the address you've got?"
  - A: "Sure, I've got [[LOCATION: 7 Halberd Close, Whitmore Saint Anne]]."
  - B: "Yes. Oh, wait. No, it's [[LOCATION: seventeen Halberd Close]], not seven. Sorry, I always do that."
  - A: "No worries, updating it now."
  - B: "Thank you."
  - A: "And for the trouble, I can give you [[PERCENT: fifteen percent]] back on the order, or a voucher for [[PERCENT: twenty]]."
  - B: "Oh, the refund please. I'll be honest, things are a bit tight. [[TOPIC: My partner's visa got refused and we're waiting on an appeal, so I'm carrying the rent on my own.]]"
  - A: "Oh, I'm sorry. Of course, refund it is. It'll go back to the card on file, {card#1}, is that right?"
  - B: "Perfect."
  - C: "Can I ask, while I'm here, did you get the delivery text from {phone#1}?"
  - B: "Uh, I did, yeah, I thought it was spam."
  - C: "Ha, everyone does. That's the new courier. I'll tell them."
  - B: "So, random question, but is the {brand_common#1} membership worth it? I keep getting emails about it."
  - A: "Oh, the {brand_common#1} club? Honestly, if you order more than a couple times a year, yeah. Free delivery."
  - B: "Okay. I'll think about it. Funny, the sofa has a little {brand_common#1.word} pattern stitched on the arms, like the cushions my mum had back in [[LOCATION: Vermont]], and I thought it was your logo."
  - A: "Ha! Fair."
  - C: "Right, I'll get off. [[TOPIC: I've got a meeting with the directors about the courier contract and, between us, a few people in my team are worried about their jobs if this doesn't get fixed.]]"
  - A: "Good luck."
  - C: "Ta. Bye."
  - A: "Okay, so that's the refund done. You'll get an email to {email#1}."
  - B: "That's the one."
  - A: "Lovely. Anything else?"
  - B: "No, that's it. Thanks so much. Sorry for the essay."
  - A: "Not at all. Enjoy the sofa, eventually!"
  - B: "Ha. Thanks. Bye!"

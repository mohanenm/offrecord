id: se-support-account-03
domain: support
speakers:
  A: account security agent for a card app, US
  B: customer locked out of the app, US, older, flustered
turns:
  - A: "{brand_common#1} account security, this call may be recorded. How can I help?"
  - B: "Hi. Yes. Hello. I'm locked out. Of the app."
  - A: "Okay, I can help with that. Can I get your full name?"
  - B: "It's {person#1}."
  - A: "Thank you. And date of birth?"
  - B: "[[DATE: April ninth, nineteen fifty-eight]]."
  - A: "Great. And I'll need to verify your social."
  - split:
      speaker: B
      slot: "ssn#1.spoken"
      before: "Oh. Okay. It's"
      interrupt: { speaker: A, text: "mm-hmm" }
      after: "I think. Yes. That's right."
  - A: "Thank you, that matches."
  - B: "Oh good."
  - A: "So what happened? Did you change phones?"
  - B: "No, no. My grandson did something. He was helping me with the, the, um, the thing where it uses your face."
  - A: "[[NEG: Face ID]]?"
  - B: "That. And then it said I'd tried too many times."
  - A: "Okay, yep, that'll lock it. Not a problem. I'm going to send a code to the phone on file. Is that still {phone#1}?"
  - B: "Let me... yes. Yes."
  - A: "Okay, sent. Can you read it to me?"
  - B: "It says, um. {account#1.spoken}."
  - A: "Perfect, that's {account#1}?"
  - B: "Yes."
  - A: "Great, you're in. Now before you go, I do see something I want to ask about."
  - B: "Oh no."
  - A: "Nothing bad necessarily. There's a purchase [[DATE: this morning]] in [[LOCATION: Las Vegas]]."
  - B: "[[LOCATION: Las Vegas]]? I'm in {location#1}. I haven't been to [[LOCATION: Nevada]] since [[DATE: nineteen ninety]]."
  - A: "Okay. So that's not you. It's {amount#1} at a, um, an electronics store."
  - B: "Absolutely not me."
  - A: "Okay. I'm going to block the card. Can you read me the full card number?"
  - B: "Hold on, my glasses. It's... {card#1.spoken}."
  - A: "Thank you. Blocked. A new one will go to [[LOCATION: 46 Larchmont Terrace, Embry Hollow]]?"
  - B: "That's my daughter's house. I'm staying there now. [[TOPIC: Since my husband passed I haven't really been able to manage on my own.]]"
  - A: "I'm so sorry."
  - B: "Thank you, dear."
  - A: "Okay, and while I have you, your balance is at, um, about [[PERCENT: eighty-five percent]] of your limit, with this charge. Once we take it off you'll be back down near [[PERCENT: sixty]]."
  - B: "That's still a lot, isn't it."
  - A: "It's okay, it's just, the interest is {percent#1} APR, so if you can pay it down, that helps."
  - B: "[[TOPIC: Money's been tight since the hospital bills started coming in.]]"
  - A: "I understand. If you ever need it, we do have a hardship programme, it can bring the rate down to [[PERCENT: single digits]] for a while."
  - B: "Oh! I didn't know that."
  - A: "Yeah, it's on our site, {url#1}, or you can just ask."
  - B: "Could you spell it out?"
  - A: "Sure, {url#1.spoken}."
  - B: "Got it. I wrote it on my hand. Ha."
  - A: "Ha. And I'm opening a fraud case for the [[LOCATION: Las Vegas]] charge, the case number is {order#1}."
  - B: "Okay."
  - A: "Also, um, just, [[TOPIC: we've seen a lot of these lately from cards that were used at the {brand#1} pharmacy chain, so if you shopped there, that's probably how it happened.]]"
  - B: "I did! Every week."
  - A: "Yep. Okay. Anything else I can help with?"
  - B: "No, no, you've been wonderful. Thank you."
  - A: "Take care now."

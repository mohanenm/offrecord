id: se-other-realestate-07
domain: other
speakers:
  A: estate agent, British, smooth
  B: buyer, British, cautious
  C: buyer's partner, American, enthusiastic, interrupts
turns:
  - A: "Hello both, thanks for jumping on. So, I've got news on [[LOCATION: Willowmere Cottage]]."
  - C: "Oh God, okay, is it good news?"
  - B: "Let him talk, love."
  - A: "Ha. It's mixed. So the vendors have come back on your offer."
  - B: "Right."
  - A: "You offered {amount#1}. They've said they'd accept, um, a bit more. They want {amount#2}."
  - C: "That's, what, like [[PERCENT: four percent]] more?"
  - B: "Bit under. [[PERCENT: Three and a half]]."
  - A: "About that, yes. And, between us, [[TOPIC: I think they'll go lower, they're going through a divorce and they need it sold before the court date.]]"
  - B: "Ah. That's, um. That's useful to know. Bit grim, but useful."
  - A: "I didn't say it."
  - C: "Say what? Ha."
  - A: "Ha. Exactly. So, how are you both feeling about the house itself?"
  - C: "I love it. I love it. The garden, the little shed, the view over to [[LOCATION: the Malvern Hills]]..."
  - B: "The survey's what worries me."
  - A: "Yes. So the surveyor flagged some damp in the back bedroom, and the roof's, um, got maybe ten years left."
  - B: "And the subsidence thing."
  - A: "Historic. Historic subsidence. It's been monitored, it's stable."
  - C: "What does that mean for, like, insurance?"
  - A: "Premiums can be a bit higher. Maybe [[PERCENT: fifteen to twenty percent]] above normal. [[ORG: Hartfield Mutual]] are usually decent for that sort of thing."
  - B: "Okay. And the mortgage? We're with [[ORG: Kingsmead Building Society]] in principle."
  - A: "What rate did they give you?"
  - B: "{percent#1} fixed, five years."
  - A: "That's good. That's really good, actually. I've seen people at [[PERCENT: five and a quarter]] this month."
  - C: "We put down [[PERCENT: ten percent]]. Is that enough?"
  - A: "For that rate, yes. More is always better, but [[PERCENT: ten]]'s fine."
  - B: "[[TOPIC: We were going to put down more, but my company's just announced a restructure and I don't know yet whether I've got a job in January, so we're keeping some back.]]"
  - A: "Very sensible."
  - C: "We're also, um, selling the place in {location#1}. My flat. Well, our flat."
  - A: "Oh, right, how's that going?"
  - C: "Slowly. [[TOPIC: The buyer's mortgage fell through because apparently he lied about his income, which, wow.]]"
  - A: "Oof. That happens more than you'd think."
  - B: "Can I ask about the area? The schools?"
  - A: "Sure. Primary's rated outstanding, in the village. Secondary is the one in {location#2}, which is fine."
  - C: "And crime?"
  - A: "Very low. The only thing anyone complains about is the bypass traffic."
  - B: "And there's no plans to build on the field behind?"
  - A: "Not that I know of. [[TOPIC: I'd check with the council though, between us the farmer who owns it has been quietly talking to a housing developer.]]"
  - C: "Ooh. Neighbours!"
  - B: "Not helpful, love."
  - A: "Ha. So, what would you like me to say to the vendors?"
  - B: "Let's say {amount#3}, and we can complete by [[DATE: the end of February]]."
  - C: "Can we say [[DATE: mid-February]]? I want to be in by [[NEG: Valentine's]]."
  - B: "That's not how it works."
  - A: "Ha. I'll say [[DATE: end of February]], with flexibility. And I'll push the damp as a reason for the number."
  - B: "Good."
  - A: "Can I just get your solicitor's details again for the memo?"
  - B: "Yes, it's [[ORG: Penrose Fairclough]], and the contact is {person#1}. Her email is {email#1}."
  - A: "Lovely. And best number for you?"
  - B: "{phone#1}."
  - C: "Or mine, I always pick up! {phone#2}."
  - A: "Ha, noted. Okay, I'll come back to you by [[DATE: tomorrow afternoon]]. Fingers crossed."
  - C: "Fingers and toes!"
  - B: "Thanks. Bye."

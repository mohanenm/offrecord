id: se-sales-expansion-02
domain: sales
speakers:
  A: account manager at the vendor, British, chatty
  B: solutions engineer at the vendor, US, precise
  C: head of retail operations at the client, British, dry humour
turns:
  - A: "Morning all. Or afternoon, for some of us. Is everyone on?"
  - C: "I'm here. Just about. The trains out of [[LOCATION: Leeds]] were a disaster again."
  - A: "Oh no. Were they? Brilliant. Well, glad you made it."
  - B: "Hi folks, I'm dialling in from [[LOCATION: Austin]], so forgive the coffee noises."
  - C: "Not at all."
  - A: "Right, so, quick agenda. We wanted to talk about rolling {product#1} out beyond the pilot stores, and {person#1.first} can walk through the technical bits."
  - B: "Yep, happy to."
  - C: "Lovely. So, where we are. The pilot's been in our {location#1} shop and the one in [[LOCATION: Bexley Fold]] since, um, since [[DATE: September]]."
  - A: "And it's gone well, I think?"
  - C: "It's gone, yes. Footfall's flat but basket size is up [[PERCENT: two points]] and the staff don't hate it, which is a first for anything head office sends them."
  - A: "Ha. High praise."
  - C: "From me it is."
  - B: "So the numbers I've got show conversion on the kiosks at around {percent#1}, which is, I mean, that's well above what we see elsewhere."
  - C: "Mm, I'd be careful with that. [[LOCATION: Bexley Fold]] had a refit in the middle, so it's a bit flattering."
  - B: "Good to know, I'll caveat it."
  - A: "So the proposal is the next wave. That's, what, {quantity#1} stores?"
  - C: "Well. That's the thing. It was going to be."
  - A: "Oh?"
  - C: "[[TOPIC: There's a review of the whole northern estate going on and I'd be surprised if all of those shops are still open by spring.]]"
  - A: "Ah."
  - C: "So I'd rather not sign for stores that might not, you know, exist."
  - A: "No, totally understandable. Could we, um, could we do it in phases? Start with the ones you're confident about?"
  - C: "Possibly. The [[LOCATION: Glasgow]] and [[LOCATION: Newcastle]] ones are safe. The {location#2} one, honestly, I wouldn't bet on it."
  - B: "From the tech side phasing is easy. Each store just gets its own tenant on {url#1}, and we flip them on when they're ready."
  - C: "Sorry, say the address again?"
  - B: "Sure, it's {url#1.spoken}."
  - C: "Got it, thanks."
  - A: "And then pricing. So the pilot was at {amount#1.spoken} per store per month."
  - C: "Which was a pilot price, I'm aware."
  - A: "Ha, yes, you are, aren't you. So list is a bit higher, but for a phased deal I think we can hold you at, um, [[PERCENT: twenty-five percent]] off list for the first year."
  - C: "Our {brand#1} kiosks came in a lot cheaper, I'll be honest."
  - B: "Sure, but they don't do the stock lookup."
  - C: "No, they don't. And [[PERCENT: half]] of them are broken. Fair."
  - A: "Can I ask, is there anything else going on we should know about? Just so we're not surprised."
  - C: "Mm. [[TOPIC: Between us, the board is talking to someone about selling the garden centre side of the business, so anything that touches those sites is frozen.]]"
  - A: "Okay. Noted, and obviously that stays here."
  - C: "Please."
  - B: "Quick technical one, on the payments integration. Are you still on {brand_common#1} for loyalty?"
  - C: "Yes, the {brand_common#1} app. God help us."
  - B: "Ha, okay. That one's fine, we've got a connector."
  - C: "Good. My nan has a tea towel with a {brand_common#1.word} print on it, and honestly it does more for customer loyalty than that app."
  - A: "Ha! So, next steps. I'll send a phased proposal for, say, [[QUANTITY: twelve]] stores in wave one."
  - C: "Make it ten. Sorry. Make it [[QUANTITY: ten]], I want room to breathe."
  - A: "Ten it is. Who should I send it to?"
  - split:
      speaker: C
      slot: "email#1"
      before: "Send it to me and copy my deputy, she's on"
      interrupt: { speaker: A, text: "sorry, one sec, writing" }
      after: "and she'll chase finance."
  - A: "Perfect. And margin-wise on your side, is there a target we need to hit for you to sign it off?"
  - C: "Payback inside a year. And [[TOPIC: if we miss the half-year number again my director has been told quite plainly it's his job on the line.]]"
  - A: "Right. No pressure then."
  - C: "None at all. Anyway. Cheers both. Have a good weekend."
  - B: "You too, take care."
  - A: "Cheers, speak soon. Bye. Bye bye."

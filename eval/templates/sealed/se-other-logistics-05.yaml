id: se-other-logistics-05
domain: other
speakers:
  A: dispatcher at a field service company, US, rapid-fire
  B: field technician, US, in a van
  C: second technician, US, on the same radio bridge
  D: operations manager, US, joins halfway
turns:
  - A: "Dispatch to {person#1.first}, you there?"
  - B: "Yep. Go."
  - A: "Next job. [[LOCATION: 418 Pruett Street]], {location#1}. Commercial freezer down."
  - B: "Copy. Work order?"
  - A: "{order#1}."
  - B: "Say again?"
  - A: "{order#1.spoken}."
  - B: "Got it. ETA, uh, forty minutes. Traffic on [[LOCATION: I-35]] is a mess."
  - A: "Copy. Customer's {client#1}. They're... not happy."
  - B: "They're never happy."
  - A: "Ha. Yeah. [[TOPIC: Heads up, they've threatened to pull the whole contract if this one isn't fixed today.]]"
  - B: "Great. No pressure."
  - C: "Dispatch, {person#2.first} here. I'm done at the [[LOCATION: Round Rock]] site, heading to [[LOCATION: Pecan Hollow]] next. Parts are short again."
  - A: "Which part?"
  - C: "Compressor relay. Third time this month."
  - A: "Yeah, [[TOPIC: our supplier's been rationing parts because we're behind on paying them, so don't expect that to get better soon.]]"
  - C: "Wait, seriously?"
  - A: "You didn't hear it from me."
  - C: "Wow. Okay."
  - A: "Can you swing by the warehouse in {location#2} and grab one?"
  - C: "Copy. On my way."
  - B: "Dispatch, the controller on the freezer at the {client#1.lower} site, does it phone home?"
  - A: "Let me check. Yeah, it's on {product#1}. Device IP is {ip#1}."
  - B: "Copy. I'll ping it when I'm there."
  - D: "Morning all. Ops here. Quick one while I've got you both."
  - B: "Go ahead."
  - D: "On-time completion last week was {percent#1}. Target's [[PERCENT: ninety percent]]."
  - B: "With what parts?"
  - D: "I know, I know. I'm raising it."
  - C: "Raise it louder."
  - D: "Ha. Noted. Also, fuel. We're spending about [[PERCENT: thirty percent]] more than budget. Try to batch your routes."
  - C: "The routing app sends me back and forth across the river like a yo-yo."
  - D: "Yeah, that's {product#1.asr}, it's the update. [[TOPIC: Between us, we're dropping it next quarter because the vendor's been bought and they're tripling the price.]]"
  - B: "[[PERCENT: Tripling]]? Like, [[PERCENT: three times]]?"
  - D: "Basically. [[PERCENT: Two hundred percent]] increase. Not happening."
  - A: "Okay, sorry to cut in, {person#1.first}, the {client#1.alias} guy just called again. Says the freezer's at, uh, [[NEG: forty degrees]] and climbing."
  - B: "Copy. Ten minutes out."
  - D: "One more thing. [[TOPIC: {person#3} won't be back for a while, he got hurt lifting a unit and it's turned into a workers comp claim, so we're down a tech.]]"
  - C: "Oh, man."
  - D: "Yeah. So, overtime's approved for this week. [[NEG: Time and a half]]."
  - C: "Copy."
  - D: "And, look, I'll just say it, [[TOPIC: there's no plan to cut anyone, I don't know where that rumour came from, but it's not true.]]"
  - B: "Okay. Good to hear."
  - D: "Okay, carry on."
  - B: "Dispatch, I'm on site. Freezer's at the back dock... nope, wrong door, it's round the side. Okay. On it."
  - A: "Copy. Call me when it's cold."
  - B: "Will do."
  - C: "Dispatch, warehouse says they've got {quantity#1.spoken} relays left, total. For the whole region."
  - A: "Grab two. Hide one."
  - C: "Ha. Copy."

id: se-other-university-06
domain: other
speakers:
  A: financial aid advisor at a university, US, patient
  B: undergraduate student, US, nervous, talks fast
  C: student's father, US, on speaker, gruff
turns:
  - A: "Office of Student Financial Services, this is the advising line. Who am I speaking with?"
  - B: "Hi! Um, hi. It's {person#1}. I'm a sophomore. I had an appointment but I couldn't make it to campus so they said to call?"
  - A: "No problem at all. Can I get your student ID?"
  - B: "Yeah, it's {account#1.spoken}."
  - A: "Okay, {account#1}. And can you confirm your date of birth?"
  - B: "[[DATE: June twenty-third, two thousand and five]]."
  - A: "Great. Okay. I see you. So what's going on?"
  - B: "Okay so, um, it's kind of a lot. My dad's on the line too, is that okay?"
  - C: "Yeah, I'm here."
  - A: "That's fine, as long as you're okay with me discussing your record in front of him."
  - B: "Yeah, yeah, that's fine."
  - C: "And, uh, one thing first. [[TOPIC: Her mother isn't in the picture, there's a protective order, so please don't send anything to the old address.]]"
  - A: "Understood. I'll flag the record."
  - B: "So basically my aid package went down. Like, a lot. Last year the grant covered, um, about [[PERCENT: seventy percent]] of tuition and now it's, like, [[PERCENT: under half]]."
  - A: "Let me look. Okay, yes, I see. So your expected family contribution went up because the tax return showed a higher income."
  - C: "That's the thing. [[TOPIC: I got laid off in the spring. That income's gone. The return's from before.]]"
  - A: "Okay. I'm sorry to hear that. That's actually exactly what the special circumstances appeal is for."
  - C: "Nobody told us that."
  - A: "I know, it's not well publicised. So with an appeal, we can use your current income. Do you have documentation of the layoff?"
  - C: "Yeah, a letter from [[ORG: Gorsefield Manufacturing]]. They, uh, they..."
  - A: "Go on, sorry?"
  - C: "They shut the whole plant in [[LOCATION: Toledo]]. Moved it to [[LOCATION: Monterrey]]. [[QUANTITY: Two hundred]] of us."
  - A: "Oh, I'm sorry. Okay. So, that letter, plus your unemployment statement, plus this form, which I'll email."
  - B: "Can you send it to me? My email's {email#1}."
  - A: "Sure. And just for your records, the appeal usually gets decided within three to four weeks, a little longer around [[NEG: Labor Day]]."
  - B: "Okay. And, um, there's another thing."
  - A: "Sure."
  - B: "[[TOPIC: I had to drop two classes last semester because I was, um, I was in the hospital for a while, for my eating disorder, and now they're saying I'm not making satisfactory progress.]]"
  - A: "Okay. Thank you for sharing that, I know that's not easy."
  - B: "Yeah."
  - A: "So, satisfactory academic progress requires you to complete [[NEG: sixty-seven percent]] of attempted credits. You're at, let me see, [[PERCENT: sixty-one percent]] right now."
  - C: "So she's [[PERCENT: six points]] short?"
  - A: "[[PERCENT: Six points]], yes. But medical circumstances are grounds for an SAP appeal as well. You'd need a letter from your provider."
  - B: "I can get that. My therapist's at the {location#1} clinic, near [[LOCATION: Ashgrove Commons]]."
  - A: "Perfect. Now, while I've got you both, I see the payment plan is past due. There's a balance of {amount#1}."
  - C: "Yeah. We know."
  - A: "If you pay {percent#1} of it by {date#1}, I can put a hold on the late fees."
  - C: "We can probably do that."
  - B: "Also, um, my housing. I'm in [[LOCATION: Calloway Hall]] but I'm thinking of moving off campus, to an apartment on [[LOCATION: Beech Street]], with friends. Would that change my aid?"
  - A: "It can. Off-campus cost of attendance is a bit lower. Maybe [[PERCENT: ten percent]] less on the housing line."
  - B: "Okay. Hmm."
  - A: "And are you still working on campus? Work-study?"
  - B: "Yeah, at the library, like {quantity#1} hours a week."
  - A: "Great, that's all fine. So, to recap. Special circumstances form, SAP appeal with the medical letter, and a partial payment by {date#1}."
  - C: "And if the appeal goes through, what are we looking at?"
  - A: "I can't promise, but typically students in your situation see the grant go back up to roughly where it was, maybe [[PERCENT: two-thirds]] or more of tuition."
  - C: "That'd make a real difference."
  - B: "[[TOPIC: Honestly, if this doesn't come through I'll have to withdraw, and I haven't told any of my friends that.]] So. Thank you so much. Seriously."
  - A: "Of course. If anything comes up, my direct line is {phone#1}. And the forms are also on {url#1}."
  - B: "Okay. Thank you. Bye!"
  - C: "Thanks. Appreciate it."

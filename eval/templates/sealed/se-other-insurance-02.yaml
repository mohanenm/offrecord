id: se-other-insurance-02
domain: other
speakers:
  A: claims handler at a motor insurer, British, brisk
  B: policyholder, British, shaken but chatty
turns:
  - A: "Good afternoon, you're through to [[ORG: Aldermoor Insurance]] claims, my name's {person#1.first}, can I take your policy number?"
  - B: "Hi, yes. Hang on. It's... {account#1}."
  - A: "Thank you. So that's {account#1.spoken}?"
  - B: "Yes, that's it."
  - A: "And your full name and the first line of your address?"
  - B: "{person#2}, and it's [[LOCATION: 12 Ferrier Row]], in {location#1}."
  - A: "Lovely, thanks. So how can I help?"
  - B: "So, I had a bit of a bump. Well, more than a bump. On the [[LOCATION: A64]], just outside [[LOCATION: York]], on [[DATE: Saturday]]."
  - A: "Oh no. Are you okay? Was anyone hurt?"
  - B: "I'm alright, mostly. A bit of whiplash. [[TOPIC: The other driver had to go to hospital and they're saying he might have a head injury, which is, I mean, I feel awful.]]"
  - A: "I'm sorry to hear that. Let's get the details down. Can you tell me what happened?"
  - B: "So I was coming up to the roundabout, and, um, he came out of nowhere, I mean, he came out of the junction, I was going maybe thirty, no, less than that, twenty-five, and he just pulled out."
  - A: "Okay. Were there any witnesses?"
  - B: "A lady in a van stopped. I've got her number. It's {phone#1.spoken}."
  - A: "Brilliant, thank you. And the police attended?"
  - B: "Yes. They gave me a reference. {order#1}."
  - A: "Great. Now, I have to ask some identity questions for a claim this size. Can I take your National Insurance number? Or, sorry, we also accept a US social if you're on the expat policy."
  - B: "Oh, I'm on the expat one, actually, I moved over from [[LOCATION: Pennsylvania]] about six years ago."
  - A: "Okay, then the social please."
  - split:
      speaker: B
      slot: "ssn#1"
      before: "It's, um,"
      interrupt: { speaker: A, text: "go on, I'm typing" }
      after: "and that's the one on file."
  - A: "Thank you. Now, the car. Where is it now?"
  - B: "It got towed to a garage in [[LOCATION: Malton]], on [[LOCATION: Wetherill Street]]. {brand#1} dealer."
  - A: "Okay. And is it driveable?"
  - B: "God, no. The front's all gone."
  - A: "Right. So it's likely to be assessed as a write-off. If that's the case we pay the market value, minus your excess, which is {amount#1}."
  - B: "And how does fault work? Because it wasn't my fault."
  - A: "So if the other insurer accepts liability, you get it all back. If it's split, say [[PERCENT: fifty-fifty]], then, well, it gets complicated. Usually it's settled at something like [[PERCENT: seventy-thirty]] in these junction cases."
  - B: "[[PERCENT: Seventy]] to him, I hope."
  - A: "Ha, that's the idea."
  - B: "And will my premium go up?"
  - A: "If it's a non-fault claim, it shouldn't, much. If it's fault, then, honestly, it could go up by [[PERCENT: a third]] or more at renewal."
  - B: "Oh. Okay."
  - A: "And I can see you've got a no-claims discount at the moment, that's [[PERCENT: sixty-five percent]] off, which is protected, so you won't lose it."
  - B: "Oh, thank goodness. Um. Can I ask something a bit awkward?"
  - A: "Of course."
  - B: "[[TOPIC: I'd had a glass of wine at lunch, just the one, and I'm terrified they're going to say I was over the limit.]]"
  - A: "Did the police breathalyse you?"
  - B: "Yes. It was fine. Under."
  - A: "Then that's fine, it'll be on the police report. Don't worry."
  - B: "Okay. Sorry. [[TOPIC: It's just, I lost my licence once before, years ago, and I can't go through that again with my job.]]"
  - A: "Understood. I'll make a note that the test was clear."
  - B: "Thank you."
  - A: "Now, a courtesy car. We can arrange one from a local firm, [[ORG: Pickering Vehicle Hire]], from [[DATE: tomorrow]]. They may be a bit slow, it's nearly [[NEG: Christmas]]."
  - B: "Yes please. I need it for work, I drive to [[LOCATION: Leeds]] every day."
  - A: "No problem. And the claim reference is {account#2}. Everything else will come by email. Is that {email#1}?"
  - B: "That's it."
  - A: "Perfect. And if the other driver's insurer contacts you directly, don't admit anything, just give them our number."
  - B: "Okay. Will do."
  - A: "Take care of that neck. Bye now."
  - B: "Thanks. Bye."

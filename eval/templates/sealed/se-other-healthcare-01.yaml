id: se-other-healthcare-01
domain: other
speakers:
  A: scheduling coordinator at a specialist clinic, US, friendly
  B: patient, US, anxious
  C: patient's adult son, US, joins on speaker
turns:
  - A: "Good morning, {client#1} scheduling, this is the referrals desk."
  - B: "Hi, good morning. I got a letter saying I need to book a, um, a follow-up? With the cardiology people?"
  - A: "Sure, I can help with that. Can I get your name and date of birth?"
  - B: "{person#1}. And it's [[DATE: the second of November, nineteen sixty-one]]."
  - A: "Thank you. Okay, I see the referral from Dr. {person#2.last}. So, um, [[TOPIC: it looks like they want you seen fairly soon after the results from the stress test.]]"
  - B: "Yes. That's what scared me. Soon."
  - A: "I understand. It's a pretty standard follow-up, but let's get you in."
  - B: "Okay. My son's here, can he listen? He's better at the, the dates."
  - A: "Of course."
  - C: "Hi. Yeah, I'm here. I drove over from [[LOCATION: Millbrook Township]]. Mom, put it on speaker. Okay."
  - A: "Hi there. So the earliest I have is {date#1} at our {location#1} campus, or a little later at the main hospital downtown. The {location#1} campus is closed [[NEG: Mondays]], just so you know."
  - C: "Where's the {location#1} one again?"
  - A: "It's at [[LOCATION: 900 Wendover Parkway]], right off the highway, by the old mall."
  - C: "Oh, okay. That's closer. Let's do that one."
  - A: "Great. Now, insurance. Are you still with [[ORG: Bellmeade Health Plan]]?"
  - B: "Yes. Through my husband's work."
  - A: "Okay. And the member ID?"
  - B: "It's {account#1.spoken}."
  - A: "Thank you, so {account#1}. Let me check... okay, so specialist visits are covered at [[PERCENT: eighty percent]] after your deductible, and you've met about, um, [[PERCENT: half]] of the deductible this year."
  - C: "So she pays [[PERCENT: twenty]]."
  - A: "[[PERCENT: Twenty percent]] of the visit, yes. And the echo, if they do one, is a separate charge, usually around {amount#1}."
  - C: "Okay."
  - B: "[[TOPIC: We were worried because my husband's company is talking about switching plans in January and I don't know if this doctor would still be in network.]]"
  - A: "Ah, that's a good question. I'd call the plan on that one. I can give you their number."
  - C: "Yeah, please."
  - A: "It's on the card, but I have it here as {phone#1}."
  - C: "Thanks. Got it."
  - A: "Okay, and I need a good phone number for reminders."
  - split:
      speaker: C
      slot: "phone#2.corrected"
      before: "Use mine, it's"
      interrupt: { speaker: A, text: "uh-huh" }
      after: "Sorry, I just got a new one."
  - A: "No problem. And can I ask, any mobility issues? Do you need a wheelchair at the entrance?"
  - B: "[[TOPIC: Since the stroke last year my left side isn't great, so maybe, yes, if it's not a bother.]]"
  - A: "Not a bother at all. I'll note it."
  - C: "Also, um, she gets really anxious. [[TOPIC: She's been on medication for it since my dad's diagnosis, and hospitals are hard for her.]]"
  - A: "Okay. Thank you for telling me. I'll put a note for the nurse."
  - B: "Thank you."
  - A: "Now, our patient portal is {url#1}. You'll see your results there, and you can message the team."
  - C: "Can you spell that?"
  - A: "Sure. {url#1.spoken}."
  - C: "Got it."
  - A: "And I'll send the confirmation to an email if you like."
  - C: "Send it to me. {email#1}."
  - A: "Perfect. Okay, so you're booked. Arrive fifteen minutes early. And bring a list of medications."
  - B: "Okay. Um. One more thing. Is it, is it serious? The letter?"
  - A: "I'm not able to say, I'm just scheduling. But honestly, most of the referrals I book are routine. Like, [[PERCENT: nine in ten]], easily."
  - B: "Okay. That helps. Thank you."
  - C: "Thanks so much."
  - A: "You're welcome. Take care now, and see you on {date#1}."

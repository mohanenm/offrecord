id: se-support-outage-02
domain: support
speakers:
  A: incident manager at the vendor, US
  B: senior support engineer at the vendor, British
  C: IT director at the client, US, angry
  D: network engineer at the client, US, quiet
turns:
  - A: "Okay, I think everyone's joined. This is the bridge for the {client#1} incident. It's, uh, a little after nine Eastern."
  - C: "It's been down for three hours."
  - A: "I know. I know. We're on it. {person#1.first}, can you give us where we are?"
  - B: "Yeah. So. Right. As of about ten minutes ago, {product#1} is responding again for most tenants, but your instance is still timing out."
  - C: "Most tenants."
  - B: "Most, yes. About {percent#1} of traffic is flowing normally."
  - C: "And the rest is us."
  - B: "The rest includes you, yeah."
  - D: "Can I, um, can I add something? We're seeing the requests leave our side. They're going out from {ip#1}."
  - B: "Okay, and they're hitting which endpoint?"
  - D: "{ip#2}. The one in your [[LOCATION: Frankfurt]] region."
  - B: "Hmm. That's interesting. That one should have failed over to [[LOCATION: Virginia]]."
  - A: "Should have."
  - B: "Should have. Give me one sec."
  - C: "While he's doing that, I need to know. Is this an attack? Yes or no."
  - A: "I, um. I can't confirm anything right now."
  - C: "That's not a no."
  - A: "[[TOPIC: What I can say is our security team is involved and they've asked us not to speculate on this call.]]"
  - C: "Wonderful."
  - B: "Okay. Right. Found something. Your tenant's pinned to the [[LOCATION: Frankfurt]] cluster by a config flag. I can unpin it."
  - C: "Do it."
  - B: "Doing it. Two minutes."
  - D: "Thanks."
  - C: "Look. I've got our CFO in my ear. [[TOPIC: We run payroll for eleven hundred people off this tomorrow morning and if it doesn't go out I'm the one explaining it.]]"
  - A: "Understood."
  - C: "And [[TOPIC: this is the second outage this quarter, so I'll be honest, there's a conversation happening about whether we renew at all.]]"
  - A: "I hear you. I'll make sure that gets to the account team."
  - B: "Okay. Unpinned. Can you try now?"
  - D: "Trying. Um. Yeah. Yeah, it's loading. It's slow but it's loading."
  - B: "Slow is expected for a bit while the caches warm up."
  - C: "How slow?"
  - B: "Latency's maybe [[PERCENT: forty percent]] above normal for the next hour, then back to baseline."
  - C: "Fine."
  - A: "Okay. So for the record, I'm opening a priority one ticket, the number is {account#1}."
  - D: "Can you read that again?"
  - A: "{account#1.spoken}."
  - D: "Got it."
  - A: "And the status page is at {url#1} if your users are asking."
  - C: "They're asking. Believe me."
  - A: "We'll also send a written RCA by [[DATE: Thursday]]."
  - C: "Who's sending it?"
  - A: "It'll come from {person#2}, she leads our reliability team. Her email's {email#1}."
  - C: "Okay."
  - B: "Sorry, one more thing I should mention. Your firewall's dropping about [[PERCENT: two percent]] of our health checks. Might be worth having a look at that, {person#3.first}."
  - D: "Yeah, I'll check the rules on our [[LOCATION: Tulsa]] edge and the backup site out in [[LOCATION: Coyle Springs]]. We've got some, um, stuff in there from before my time."
  - B: "Ha. Don't we all."
  - C: "And what about our data? Anything... lost? Exposed?"
  - A: "[[TOPIC: I'd rather that answer come in writing from our legal team, to be honest with you.]]"
  - C: "That's an answer in itself."
  - A: "[[TOPIC: It's not, and I don't want you to read it that way, there's no evidence anything left the system.]]"
  - C: "Okay. Okay. I'll take that for now."
  - A: "Anything else from your side?"
  - D: "Uptime last month was, what, [[PERCENT: ninety-nine point one]]? That's below the SLA, right?"
  - A: "Yep, the SLA's [[NEG: 99.9%]]. Credits apply. That'll be in the RCA."
  - C: "Good. Thanks for getting it moving. Call me directly if it drops again. {phone#1}."
  - A: "Will do. Thanks everyone. I'm closing the bridge."

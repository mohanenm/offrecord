id: se-internal-board-02
domain: internal
speakers:
  A: CFO, British, measured
  B: head of corporate development, US, excitable
  C: financial controller, US, careful
turns:
  - A: "Right, shall we crack on? Board's on [[DATE: Wednesday]] and I want the deck locked by [[DATE: tomorrow]] night, and the model in [[NEG: Excel]] is still a mess."
  - B: "Yep. Yes. Totally."
  - C: "I've got the actuals up."
  - A: "Go on then."
  - C: "So, quarter close. Revenue {amount#1.spoken}, which is, um, [[PERCENT: down 8%]] on the same quarter last year."
  - A: "Ouch."
  - C: "Yeah. Gross margin held, more or less, at [[PERCENT: forty-one]]. EBITDA's the problem."
  - A: "How bad?"
  - C: "[[TOPIC: We missed the number we gave the lenders, and if next quarter looks like this one we'll be in breach.]]"
  - A: "Mm. Right. Okay. Let's put a pin in that, it goes in the closed session."
  - C: "Sure."
  - A: "{person#1.first}, the deal."
  - B: "Okay! So. {codename#1}. We've had two more sessions with their founders. [[TOPIC: They're open to an offer in the region of three times revenue, and they've told us nobody else is in the room yet.]]"
  - A: "Do we believe that?"
  - B: "Mmm. Mostly. [[TOPIC: I heard from a banker friend that a private equity group out of London has been sniffing around.]]"
  - A: "Hm."
  - B: "Sorry, scratch that, I don't want that in the minutes, it's hearsay."
  - A: "It's not going in the minutes."
  - B: "The target's got a big team in [[LOCATION: Kraków]] and a small sales office in [[LOCATION: Rotterdam]], plus the head office in {location#1} and a tiny support desk in [[LOCATION: Port Maddoc]]."
  - C: "And we'd keep all of that?"
  - B: "[[TOPIC: Honestly, the plan is to keep the engineers and wind down most of their sales and G&A within about six months of closing.]]"
  - A: "That's the bit the board will want to understand properly."
  - B: "Sure. Synergies are maybe {amount#2} a year, mostly people."
  - C: "What are they doing in revenue?"
  - B: "Growing, um, [[PERCENT: low thirties]]. [[PERCENT: Low thirties]] year on year. Retention's strong, like [[PERCENT: a hundred and ten percent]] net."
  - A: "Who's their biggest customer?"
  - B: "{client#1}. They're about [[PERCENT: a fifth]] of revenue on their own, which, you know, concentration risk."
  - A: "Yes. Quite."
  - C: "And they're also our customer. Bit awkward."
  - B: "Bit awkward. Yeah."
  - A: "Okay. Who's advising?"
  - B: "[[ORG: Calderbank Partners]] on our side. Their lawyers are [[ORG: Mewes Ashworth]]."
  - A: "Fine. Next. Pricing."
  - C: "So we're proposing a [[PERCENT: seven percent]] list increase from [[DATE: January]], and pushing renewals up by [[PERCENT: fifty basis points]] above inflation."
  - A: "Basis points on a renewal, that's a new one."
  - C: "Ha, yeah, the sales team hated it."
  - A: "And churn?"
  - C: "Running at {percent#1.spoken}, which is fine. But [[TOPIC: {client#2} gave notice last week, and they're the biggest logo we've lost in two years.]]"
  - A: "Bloody hell. Why?"
  - C: "Price, mostly. And the outage in [[DATE: August]]."
  - A: "Okay. That needs to go in."
  - C: "Yeah."
  - A: "Anything else that'll make me spill my tea?"
  - B: "Uh, one thing. Our regulator in, um..."
  - A: "Go on."
  - B: "Sorry, not regulator. The data protection people. [[TOPIC: There's an inquiry open about the customer data we kept after contracts ended, and our lawyers think there might be a fine.]]"
  - A: "How much?"
  - B: "Unknown. Could be up to [[PERCENT: two percent]] of turnover, worst case. Probably far less."
  - A: "Right. Closed session. Again."
  - C: "Closed session's going to be longer than the open one."
  - A: "Ha. It usually is. Okay. Send me the draft by six [[DATE: tomorrow]]. Thanks both."
  - B: "Will do."
  - C: "Night."

id: se-sales-pricing-03
domain: sales
speakers:
  A: VP of sales, US, fast talker
  B: regional sales manager, US
  C: deal desk analyst, British
  D: product marketing lead, US
  E: enterprise account executive, Irish
turns:
  - A: "Okay, we're at time, let's go. Quick one today."
  - B: "Yep."
  - C: "Here."
  - D: "Hi."
  - A: "Pricing. {codename#1}. Where are we."
  - D: "So. Um. The new tiers. We're still aiming for [[DATE: Q2]], but don't say that outside this room."
  - A: "Not even to customers?"
  - D: "Especially not to customers. [[TOPIC: If {client#1} hears we're bundling the add-ons for free next year, they'll stop paying for them tomorrow.]]"
  - B: "They're already asking."
  - A: "Asking what?"
  - B: "Whether there's a new price list coming. Their procurement guy in [[LOCATION: Minneapolis]] heard something, and so did the team at their [[LOCATION: Hessle Point]] office."
  - A: "From who?"
  - B: "No idea."
  - D: "Great."
  - A: "Okay. Numbers. Deal desk?"
  - C: "Right, so, average discount last quarter was {percent#1.spoken}. That's up from, um, [[PERCENT: nineteen]], no, sorry, [[PERCENT: seventeen percent]] the quarter before."
  - A: "Too high."
  - C: "Much too high. And the [[LOCATION: EMEA]] team are worse, they're giving away [[PERCENT: thirty-plus percent]] on anything over {amount#1}."
  - E: "Ah now, in fairness..."
  - A: "Go on."
  - E: "In fairness, we've had three competitors drop their prices in [[LOCATION: Germany]] alone. It's not us being soft."
  - A: "Who?"
  - E: "{brand#1.asr}, mostly. They're practically giving it away."
  - A: "[[TOPIC: Look, I'll say this once: we are not winning on price this year, and the board has told us gross margin has to come back up or the plan gets rewritten.]]"
  - B: "Rewritten meaning..."
  - A: "Meaning what you think it means."
  - B: "Okay."
  - D: "Can I just say, the new floor is [[PERCENT: twelve pct]] max without my sign-off. Anything above that goes to deal desk."
  - C: "And above [[PERCENT: twenty]] goes to {person#1.last}."
  - A: "Which is me. Fine."
  - B: "What about renewals?"
  - D: "Renewals get the uplift. [[PERCENT: Three to five]]."
  - B: "Percent?"
  - D: "[[PERCENT: Three to five percent]], yeah. Depends on tier."
  - E: "Sorry, can I raise one thing about my patch?"
  - A: "Quick."
  - E: "[[TOPIC: {client#2.alias} have been quietly running a bake-off with another vendor and I think we're going to lose them at renewal.]]"
  - A: "How big?"
  - E: "{amount#2} ARR. Give or take."
  - A: "Jesus."
  - E: "Yeah. And they're our reference account in [[LOCATION: Dublin]]."
  - A: "Okay, offline, you and me, after this."
  - E: "[[NEG: Grand]]."
  - B: "One more from me, sorry. [[TOPIC: My two seniors in {location#1} have both had offers from elsewhere and I'm pretty sure one of them is already gone in her head.]]"
  - A: "Can we counter?"
  - B: "[[TOPIC: Not with the freeze.]]"
  - A: "Right. [[TOPIC: Yeah, okay, there's no freeze, officially, so don't call it that.]]"
  - B: "Ha. Okay. The pause."
  - A: "The pause. Anything else?"
  - C: "Just, pipeline coverage is at two point eight times, target's three."
  - A: "Closer than I thought. Okay. Close the {quantity#1} deals in commit and we're fine. Thanks all."
  - D: "Thanks."
  - E: "Cheers."

id: se-sales-renewal-01
domain: sales
speakers:
  A: account executive at the vendor, US, upbeat
  B: operations director at the client, US, tired and blunt
turns:
  - A: "Hey, hey, can you hear me? I think my headset just did the thing again."
  - B: "Yeah, I got you. You're a little crunchy but it's fine."
  - A: "Okay good. Sorry, I'm in a hotel lobby in [[LOCATION: Denver]] and the wifi is, uh, aspirational."
  - B: "Ha. Better than our office in {location#1}, trust me."
  - A: "So, um, thanks for making time. I know the {client#1} renewal is coming up on {date#1} and I wanted to get ahead of it."
  - B: "Sure. Let me just say up front, I've got maybe twenty minutes."
  - A: "Totally fine. So right now you're on {quantity#1} seats of {product#1} at {amount#1} a year."
  - B: "Mm-hmm."
  - A: "And usage is, honestly, it's great, adoption is around {percent#1} across the teams that have it."
  - B: "That number's a little generous. The [[LOCATION: Phoenix]] crew barely logs in, and the [[LOCATION: Garrow Flats]] warehouse never has."
  - A: "Fair, fair. Okay. So what's top of mind for you going in?"
  - B: "Look, I'll be straight with you. [[TOPIC: Finance told every department to come in at least fifteen percent under last year or they'll make the cuts for us.]]"
  - A: "Oof. Okay."
  - B: "And it's not just software. [[TOPIC: We closed the {location#2} distribution center last month and nobody's said anything publicly yet.]]"
  - A: "I, uh, I didn't know that. I'm sorry."
  - B: "Yeah. So, you know. Keep that one to yourself."
  - A: "Of course. Um, so, if we're talking budget, what does under look like? Like, [[PERCENT: ten percent]] off? More?"
  - B: "More like [[PERCENT: a fifth]], honestly. And I need to show [[PERCENT: two-thirds]] of the seats actually being used or I can't defend it."
  - A: "Okay so, let me think out loud. If we drop to, uh, [[QUANTITY: ninety]] seats, no wait, let's say [[QUANTITY: ninety-five]], and I can get you a multi-year at [[PERCENT: eighteen pct]] off list..."
  - B: "Multi-year is hard right now."
  - A: "Why is that?"
  - B: "[[TOPIC: Honestly there's a decent chance we don't exist in this form by next summer, there are people from another company walking the floors with clipboards.]]"
  - A: "Ah. Okay. Got it."
  - B: "You didn't hear that from me."
  - A: "Heard nothing. So, so a one-year then. And what if we bundled in {product#2}? Your team asked about it back in [[DATE: March]]."
  - B: "Is that the reporting thing?"
  - A: "Yeah, the dashboards. We usually do it at {amount#2} but I could fold it in."
  - B: "Mm. That's interesting actually. Our churn reporting is a mess. We lost, what, about [[PERCENT: a quarter]] of our small accounts last year and nobody could tell me why until it was over."
  - A: "Right, and that's exactly the, um, the use case."
  - B: "Who'd I talk to about setup?"
  - A: "That'd be {person#1} on our side, she's based out of [[LOCATION: Columbus]]. I'll send you her email, it's {email#1}."
  - B: "Can you spell that?"
  - A: "Yep, it's {email#1.spoken}."
  - B: "Got it. Okay."
  - A: "And just so I have it right, your billing contact is still {person#2}?"
  - B: "No, {person#2.first} left. [[TOPIC: She filed a complaint about her manager on the way out and it's turned into a whole thing with HR.]]"
  - A: "Ah, yikes. Okay, who should I put?"
  - B: "Put me for now. My cell is {phone#1}."
  - A: "Cool. And the PO, is that still going through [[ORG: Bramwell Procurement Services]]?"
  - B: "Yeah, they handle all our vendor stuff. They'll want the quote by [[DATE: the twelfth]]."
  - A: "Okay. So recap. One year, ninety-five seats, {product#2.alias} folded in, and I'll come back with a number that's, let's say, [[PERCENT: low twenties]] below this year's total."
  - B: "If you can get there, I can probably get it signed."
  - A: "And growth-wise, if you do reopen anything, or expand into [[LOCATION: the Carolinas]] like you mentioned..."
  - B: "Ha. The only thing expanding around here is the [[NEG: Thanksgiving]] potluck."
  - A: "Ha, okay. Fair."
  - B: "Anything else?"
  - A: "Just, um, the case study. Marketing keeps asking if they can use the {client#1.alias} logo."
  - B: "Absolutely not. Not this year."
  - A: "Understood. I'll tell them. Thanks, really appreciate the candour."
  - B: "Yep. Talk soon."

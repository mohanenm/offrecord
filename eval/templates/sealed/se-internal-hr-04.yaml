id: se-internal-hr-04
domain: internal
speakers:
  A: HR business partner, British, formal and careful
  B: team manager, British, anxious, talks in long bursts
turns:
  - A: "Thanks for making the time. Is the door shut your end?"
  - B: "Yeah, I'm in one of the little booths. The ones with no air."
  - A: "Ha, I know them well. Right. So, as I said in my message, this is a confidential conversation. I'll keep notes but they'll stay in the case file."
  - B: "Understood."
  - A: "So. You wanted to raise something about your team."
  - B: "Yes. Okay. Um. So I'll just say it. [[TOPIC: One of my team, {person#1}, came to me last week and said that {person#2} has been making comments about her, you know, about her appearance, and messaging her late at night, and it's been going on since the conference in the spring.]] And she was really upset, like really upset, and she asked me not to do anything, but I don't think I can just not do anything? Can I?"
  - A: "No, you did the right thing coming to us."
  - B: "Okay. Good. Because I haven't slept."
  - A: "I understand. Can I ask, where was the conference?"
  - B: "It was in [[LOCATION: Harrowfield]], at the big hotel by the station. And then there was a dinner in {location#1} afterwards."
  - A: "And were you there?"
  - B: "I was at the conference, not at the dinner. I left early to get the train back to [[LOCATION: Sheffield]]."
  - A: "Okay. And has anyone else witnessed anything?"
  - B: "She thinks {person#3.first} might have seen some of the messages. And, um, [[TOPIC: I think there may have been a similar complaint about him at his last company, someone mentioned it at the Christmas do.]]"
  - A: "Okay. I'll note that as hearsay, but thank you."
  - B: "Sure."
  - A: "Now, how is she? Is she at work?"
  - B: "[[TOPIC: She's been off since Monday.]]"
  - A: "Sorry, I'll rephrase, can I ask if there's any health element we need to be aware of?"
  - B: "[[TOPIC: She's been under the doctor for anxiety for a while, and this has knocked her back quite badly, she said she's had a few panic attacks at her desk.]]"
  - A: "Okay. That's really important for us to know, for the support side. We can refer her to occupational health, and the employee assistance line is open around the clock."
  - B: "What's the number? I'd like to give it to her."
  - A: "It's {phone#1}. And I'd suggest she emails me directly as well, at {email#1}."
  - B: "Okay. Thank you."
  - A: "Now. A couple of process things. Is he still in the team?"
  - B: "Yes. That's the awful bit. He sits about two desks away."
  - A: "Right. We'll look at whether we can move him temporarily, maybe to the {location#2} office, or the hot desks at [[LOCATION: Tannery Yard]]. That won't be framed as a punishment."
  - B: "Okay."
  - A: "Can I ask, sorry, this is a bit indirect, [[TOPIC: but is there anything about his performance or his contract we should know about?]]"
  - B: "Well. [[TOPIC: He's on a performance plan already, actually.]] His numbers have been about..."
  - A: "Go on."
  - B: "His numbers have been about [[PERCENT: forty percent]] of target for two quarters. And the team's attrition, I mean, honestly, we've lost [[PERCENT: a third]] of the team this year and I'm now wondering if this is part of why."
  - A: "Mm. That's a fair question. For what it's worth, exit interviews flag a manager issue in maybe [[PERCENT: one in five]] cases across the whole business, so it's worth asking."
  - B: "And I know the business is, um, [[TOPIC: I know there's a restructure coming in Q1...]]"
  - A: "I can't comment on that."
  - B: "No, I know. Sorry."
  - A: "But, for what it's worth, any outcome here is separate from that. I want to be really clear."
  - B: "Okay. Yes."
  - A: "So, next steps. I'll open a case, the reference will be {account#1}. I'll speak to her first, with her consent. Then we'll decide on an investigation."
  - B: "Will he know it came from me?"
  - A: "We'll do our best. I can't promise anonymity entirely, but we'll be careful."
  - B: "Okay. Thank you. Honestly. This is the worst bit of the job."
  - A: "It really is. You're doing fine. Speak [[DATE: Friday]]?"
  - B: "[[DATE: Friday]]. Yes. Thanks."

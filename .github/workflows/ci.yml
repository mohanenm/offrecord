name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            lock: requirements/dev-py310.lock
            audit: false
          - python-version: "3.12"
            lock: requirements/dev.lock
            audit: true
    steps:
      # Actions pinned by commit SHA (supply chain). Tags noted for humans.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' -c ${{ matrix.lock }}
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest -q
      - name: Dependency audit
        if: ${{ matrix.audit }}
        run: pip-audit --skip-editable -r ${{ matrix.lock }}

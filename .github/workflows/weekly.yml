# Newest dependency versions on the newest Pythons, ignoring the locks. This reports breakage
# early; it never blocks a pull request.
name: weekly

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  latest:
    name: latest deps (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install with every dependency at its newest release
        run: |
          python - <<'PY'
          import re, tomllib
          p = tomllib.load(open("pyproject.toml", "rb"))["project"]
          reqs = p["dependencies"] + p["optional-dependencies"]["dev"]
          open("/tmp/latest.txt", "w").write("\n".join(re.split(r"[=<>~!]", r)[0] for r in reqs))
          PY
          python -m pip install --upgrade -r /tmp/latest.txt
          python -m pip install --no-deps -e .
          python -m pip list --outdated || true
      - run: mypy
      - run: pytest -q
      - run: pip-audit --strict --skip-editable

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "offrecord"
version = "0.0.1"
description = "Redact meeting and call transcripts offline before they reach an LLM, and restore the answer."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "src/offrecord/data/LICENSE-SCOWL.txt"]
requires-python = ">=3.10"
keywords = ["redaction", "pii", "transcripts", "privacy", "llm", "offline", "anonymization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Text Processing",
]
# Tier 0 runtime dependencies are added only when code uses them, pinned.
dependencies = [
    "PyYAML==6.0.4",
    "rapidfuzz==3.14.5",
    "jellyfish==1.2.1",
    "cryptography==50.0.2",
]

[project.urls]
Homepage = "https://mohanenm.github.io/offrecord/"
Source = "https://github.com/mohanenm/offrecord"
Issues = "https://github.com/mohanenm/offrecord/issues"
Changelog = "https://github.com/mohanenm/offrecord/blob/main/CHANGELOG.md"
Documentation = "https://github.com/mohanenm/offrecord/blob/main/docs/architecture.md"

[project.optional-dependencies]
# Tier 1: NER ensemble (GLiNER + BERT-NER) and sentence embeddings via ONNX Runtime (no PyTorch).
ner = [
    "onnxruntime==1.23.2",
    "numpy==2.2.6",
    "tokenizers==0.23.3",
]
# Tier 2: grammar-constrained JSON labels from a small GGUF model via llama.cpp.
llm = [
    "llama-cpp-python==0.3.38",
]
dev = [
    "pytest==9.2.0",
    "hypothesis==6.168.5",
    "ruff==0.17.6",
    "pip-audit==2.10.1",
    "mypy==2.4.1",
    "types-PyYAML==6.0.12.20261122",
    "build==1.6.1",
]

[project.scripts]
offrecord = "offrecord.cli:entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"offrecord.data" = ["*.gz", "LICENSE-SCOWL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.format]
# Code sketches in docs keep hand-aligned comments.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "T20", "SIM", "RUF"]
# SIM905: "a b c".split() word lists are easier to read and review than list literals.
ignore = ["SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "S311"]
# Dev scripts print synthetic tuning data only.
"scripts/**" = ["T20"]
# The only modules allowed to print (to stderr / command output). T20 guards against stray
# debug prints leaking data everywhere else.
"src/offrecord/cli.py" = ["T20"]
"src/offrecord/safe_errors.py" = ["T20"]
"src/offrecord/models/setup.py" = ["T20"]  # download progress on stderr
"src/offrecord/models/__init__.py" = ["E501"]  # pinned SHA-256 strings
# Seeded PRNG is the point of a deterministic synthetic-data generator.
"src/offrecord/evaluation/generator.py" = ["S311"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_ignores = true

# Optional modules (tiktoken if the user installs it, the [ner] and [llm] extras): tiktoken and
# onnxruntime ship no types, and none are present on a base install. Typed ones are still
# checked when installed.
[[tool.mypy.overrides]]
module = ["tiktoken", "tiktoken.*", "onnxruntime", "onnxruntime.*", "llama_cpp", "llama_cpp.*",
          "tokenizers", "tokenizers.*", "numpy", "numpy.*"]
ignore_missing_imports = true
